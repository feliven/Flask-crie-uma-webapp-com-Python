{% extends "template.html" %} {% block conteudo %}
<form method="post" action="{{ url_for('criar') }}" enctype="multipart/form-data" class="d-flex gap-4">
  <figure class="img-thumbnail col-md-4">
    <img src="{{ url_for('imagem', nome_arquivo='capa_padrao.jpg') }}" alt="" class="img-fluid" />
    <figcaption>
      <label for="capa" class="file-container">Mudar capa</label>
      <input type="file" name="imagem" id="capa" accept=".jpg,.png" />
    </figcaption>
  </figure>
  <fieldset class="d-flex flex-column gap-3 col-md-8">
    <div class="form-group">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" class="form-control" />
    </div>
    <div class="form-group">
      <label for="categoria">Categoria</label>
      <input type="text" id="categoria" name="categoria" class="form-control" />
    </div>
    <div class="form-group">
      <label for="console">Console</label>
      <input type="text" id="console" name="console" class="form-control" />
    </div>
    <button type="submit" class="btn btn-primary btn-salvar">Salvar</button>
  </fieldset>
</form>
{% endblock %}

{% extends "template.html" %} {% block conteudo %}
<form method="post" action="{{ url_for('atualizar') }}" enctype="multipart/form-data" class="d-flex gap-4">
  <figure class="img-thumbnail col-md-4">
    <img src="{{ url_for('imagem', nome_arquivo=capa_jogo) }}" alt="" class="img-fluid" />
    <figcaption>
      <label for="capa" class="file-container">Mudar capa</label>
      <input type="file" name="imagem" id="capa" accept=".jpg,.png" />
    </figcaption>
  </figure>
  <fieldset class="d-flex flex-column gap-3 col-md-8">
    <input type="hidden" name="id" value="{{ jogo.id }}" />
    <div class="form-group">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" class="form-control" value="{{ jogo.nome }}" />
    </div>
    <div class="form-group">
      <label for="categoria">Categoria</label>
      <input type="text" id="categoria" name="categoria" class="form-control" value="{{ jogo.categoria }}" />
    </div>
    <div class="form-group">
      <label for="console">Console</label>
      <input type="text" id="console" name="console" class="form-control" value="{{ jogo.console }}" />
    </div>
    <div class="d-flex gap-3">
      <button type="submit" class="btn btn-primary btn-salvar">Salvar</button>
      <a class="btn btn-outline-danger" href="{{ url_for('index') }}">Voltar</a>
    </div>
  </fieldset>
</form>
{% endblock %}
